[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mediapipe>=1.0.1",
    "onnxruntime>=1.29.0",
    "openai>=3.8.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "pillow-heif>=1.7.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "reportlab>=5.0.1",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.0.52",
    "stripe>=15.6.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Session-scoped so the (session-scoped) SQLAlchemy async engine's pooled
# connections are always used from the loop they were created on -- mixing
# a session-scoped engine with per-test event loops causes spurious
# "Event loop is closed" errors during connection teardown on Windows.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends()/Query()/etc. are specifically designed to be used
# as argument defaults -- this is idiomatic FastAPI, not the footgun the rule
# is meant to catch.
ignore = ["B008"]

[[tool.mypy.overrides]]
# Neither ships a py.typed marker/stubs. boto3 is only imported lazily
# inside S3PhotoStorage (see photo_storage.py) -- local-provider
# deployments never need it installed at all. reportlab ships no
# py.typed marker either (types-reportlab exists but lags releases).
module = ["mediapipe.*", "boto3.*", "reportlab.*", "onnxruntime.*", "cv2.*"]
ignore_missing_imports = true
